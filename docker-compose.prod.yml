# ─────────────────────────────────────────────────────────────────────────────
#  Enterprise AI Workspace – Production Docker Compose for AWS EC2
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: enterprise-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Express Backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: enterprise-backend
    restart: always
    environment:
      - MONGO_URI=mongodb://ashima_db:Ashima41111@ac-vrj5mkm-shard-00-00.0nb6byc.mongodb.net:27017,ac-vrj5mkm-shard-00-01.0nb6byc.mongodb.net:27017,ac-vrj5mkm-shard-00-02.0nb6byc.mongodb.net:27017/?ssl=true&replicaSet=atlas-xyd4c8-shard-0&authSource=admin
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        VITE_SUPABASE_PROJECT_ID: oyzhfgvdndiljxosibjm
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EfaCTghUb16MKe_k52QjrQ_1N-LvUBX
        VITE_SUPABASE_URL: https://oyzhfgvdndiljxosibjm.supabase.co
        VITE_API_URL: /api
    container_name: enterprise-frontend
    restart: always
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Prometheus Monitoring ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: enterprise-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Grafana Observability Dashboards ───────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: enterprise-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx Edge Proxy ───────────────────────────────────────────────────────
  edge-proxy:
    image: nginx:1.27-alpine
    container_name: enterprise-edge-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - prometheus
      - grafana
    networks:
      - enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ────── Volumes ───────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  enterprise_net:
    driver: bridge

