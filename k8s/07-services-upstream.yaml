# ─────────────────────────────────────────────────────────────────────────────
#  Upstream Internal Services for Nginx reverse proxy resolution in Kubernetes
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: enterprise-workspace
  labels:
    app: enterprise-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: enterprise-backend
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: enterprise-workspace
  labels:
    app: enterprise-frontend
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: enterprise-backend
