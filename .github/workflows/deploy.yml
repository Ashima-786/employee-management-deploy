name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - project

jobs:
  test-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Run Backend Unit Tests
        run: |
          cd backend
          npm ci
          npm test

      - name: 4. DevSecOps Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  deploy:
    name: Deploy to AWS EC2
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/employee-management-deploy
            git pull origin main
            sudo docker compose down
            sudo docker compose up -d --build --remove-orphans
            sleep 10
            curl -sf http://127.0.0.1/api/health || curl -sf http://127.0.0.1:5000/api/health
