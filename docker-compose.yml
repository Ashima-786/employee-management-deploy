version: '3.8'

services:
  backend:
    build: ./backend
    container_name: enterprise-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - mern-network

  frontend:
    build: .
    container_name: enterprise-frontend
    ports:
      - "8081:8080"
    depends_on:
      - backend
    env_file:
      - ./.env
    networks:
      - mern-network
    stdin_open: true
    tty: true

networks:
  mern-network:
    driver: bridge