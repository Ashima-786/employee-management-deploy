services:
  mongodb:
    image: mongo:latest
    container_name: enterprise-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: enterprise-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/employee_db
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: enterprise-frontend
    ports:
      - "8081:8080"
    environment:
      - VITE_SUPABASE_URL=your_supabase_url_here
      - VITE_SUPABASE_PUBLISHABLE_KEY=your_supabase_key_here
      - SUPABASE_URL=your_supabase_url_here
      - SUPABASE_PUBLISHABLE_KEY=your_supabase_key_here
    depends_on:
      - backend

volumes:
  mongo_data: