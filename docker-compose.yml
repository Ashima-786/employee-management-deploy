version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: enterprise-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: enterprise-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/employee_db
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: enterprise-frontend
    ports:
      - "8081:80" 
    depends_on:
      - backend

volumes:
  mongo_data: