---
- name: Enterprise Host Hardening & Zero-Drift Container Deployment
  hosts: webservers
  become: yes
  vars:
    project_dir: /home/ubuntu/employee-management-deploy
    swap_size_mb: 2048

  tasks:
    - name: 1. Update APT package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Install prerequisite system packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - python3-pip
        state: present

    - name: 3. Provision 2 GB persistent swap memory
      block:
        - name: Check if swapfile exists
          stat:
            path: /swapfile
          register: swap_stat

        - name: Allocate swap file if missing
          command: fallocate -l {{ swap_size_mb }}M /swapfile
          when: not swap_stat.stat.exists

        - name: Set secure permissions on swapfile
          file:
            path: /swapfile
            owner: root
            group: root
            mode: '0600'

        - name: Format swapfile
          command: mkswap /swapfile
          when: not swap_stat.stat.exists

        - name: Enable swap
          command: swapon /swapfile
          when: not swap_stat.stat.exists
          ignore_errors: yes

        - name: Persist swap entry in /etc/fstab
          mount:
            name: none
            src: /swapfile
            fstype: swap
            opts: sw
            state: present

        - name: Set kernel vm.swappiness to 10
          sysctl:
            name: vm.swappiness
            value: '10'
            state: present
            reload: yes

    - name: 4. Install Docker Engine and Compose Plugin
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: 5. Ensure Docker service is enabled and running
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: 6. Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: 7. Configure Docker daemon.json logging governance
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: Restart Docker

    - name: 8. Clone or synchronize latest repository code
      git:
        repo: https://github.com/Ashima-786/employee-management-deploy.git
        dest: "{{ project_dir }}"
        version: main
        force: yes
      become_user: ubuntu

    - name: 9. Deploy and launch enterprise multi-container stack
      command: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      become: yes

    - name: 10. Smoke test Edge Proxy HTTP 200
      uri:
        url: http://127.0.0.1/
        status_code: 200
        timeout: 15
      register: edge_check
      until: edge_check.status == 200
      retries: 6
      delay: 5

    - name: 11. Smoke test Backend Health Endpoint
      uri:
        url: http://127.0.0.1/api/health
        status_code: 200
        timeout: 10
      register: api_check
      until: api_check.status == 200
      retries: 6
      delay: 5

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

